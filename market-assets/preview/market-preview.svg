      <rect x="266" width="244" height="66" rx="33" fill="#EEF7F6" stroke="#D7E8E6"/>
      <text x="388" y="43" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#396966">微信小程序</text>
      <rect x="532" width="244" height="66" rx="33" fill="#EEF7F6" stroke="#D7E8E6"/>
      <text x="654" y="43" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#396966">百度小程序</text>
    </g>
