  <g transform="translate(74 1212)">
    <rect width="932" height="130" rx="30" fill="#174B49"/>
    <g transform="translate(34 34)">
      <path d="M25 0 47 9v18c0 16-9 28-22 35C12 55 3 43 3 27V9Z" fill="none" stroke="#79D2CD" stroke-width="4"/>
      <path d="m16 30 7 7 13-16" fill="none" stroke="#79D2CD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="112" y="56" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">需要宿主后端适配器</text>
    <text x="112" y="94" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#B9DAD7">不内置业务域名、AppID、site key 或 secret</text>
  </g>

  <text x="540" y="1394" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#6B8886">YINZON-UNIAPP-CAP · V0.2.0</text>
