<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5F6F3"/>
      <stop offset="55%" stop-color="#F8FBFA"/>
      <stop offset="100%" stop-color="#EAF2F2"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A8D8B"/>
      <stop offset="100%" stop-color="#11AAA4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#155C59" flood-opacity="0.14"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#155C59" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="url(#bg)"/>
  <circle cx="1000" cy="118" r="240" fill="#CDEDEA" opacity="0.56"/>
  <circle cx="36" cy="1298" r="210" fill="#D6EFEC" opacity="0.72"/>

  <g transform="translate(74 68)">
    <rect width="76" height="76" rx="22" fill="#0D9694" filter="url(#smallShadow)"/>
    <text x="38" y="52" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#FFFFFF">英</text>
    <text x="99" y="33" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#174B49">英纵</text>
    <text x="99" y="61" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#5B7D7A">YINZON</text>
  </g>

  <g transform="translate(74 205)">
