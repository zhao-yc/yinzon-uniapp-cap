    <text x="0" y="92" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="75" font-weight="800" fill="#113D3B">英纵 uni-app</text>
    <text x="0" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="75" font-weight="800" fill="#113D3B">Cap 安全验证</text>
    <text x="2" y="238" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="29" fill="#5B7D7A">验证留在当前表单，不再跳转独立页面</text>
  </g>

  <g transform="translate(74 515)">
    <rect width="932" height="628" rx="44" fill="#FFFFFF" stroke="#D5E8E5" stroke-width="2" filter="url(#shadow)"/>

    <g transform="translate(54 48)">
      <rect width="200" height="48" rx="24" fill="#E7F6F4"/>
      <circle cx="27" cy="24" r="8" fill="#0D9694"/>
      <text x="48" y="32" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#24706D">当前表单内验证</text>
    </g>

    <text x="54" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#173F3D">安全验证</text>
    <text x="54" y="197" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#76918E">平台凭证 · Cap challenge · PoW · 一次性票据</text>

    <g transform="translate(54 238)">
      <rect width="824" height="94" rx="22" fill="#F5FAF9" stroke="#D9E9E7" stroke-width="2"/>
